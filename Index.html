<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL Casino</title>
<style>
body {
  background:#100d08;
  color:gold;
  font-family:Arial;
  text-align:center;
  padding:20px;
}
h1 {font-size:42px;color:gold;}
.card {
  background:#292016;
  border:2px solid gold;
  border-radius:18px;
  padding:20px;
  margin:20px 0;
}
button {
  background:gold;
  color:#180f00;
  border:0;
  padding:14px 25px;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  margin:8px;
}
</style>
</head>
<body>
<h1>👑 ROYAL 👑</h1>
<h3>WELCOME TO ROYAL GAMES</h3>

<div class="card">
<h2>🪙 Virtual Coins</h2>
<h2 id="coins">1000</h2>
</div>

<div class="card">
<h2>🎰 SLOT GAME</h2>
<h1 id="slots">🍒 🍋 🍇</h1>
<button onclick="spin()">SPIN</button>
</div>

<div class="card">
<h2>🎡 ROULETTE GAME</h2>
<h1 id="wheel">🎡</h1>
<button onclick="roulette()">PLAY</button>
</div>

<p id="result">Good Luck!</p>

<script>
let coins = 1000;

function update() {
 document.getElementById("coins").innerText=coins;
}

function spin() {
 if(coins<10) {
  alert("Not enough coins!");
  return;
 }
 coins-=10;
 let icons=["🍒","🍋","🍇","💎","7️⃣"];
 let a=icons[Math.floor(Math.random()*5)];
 let b=icons[Math.floor(Math.random()*5)];
 let c=icons[Math.floor(Math.random()*5)];
 document.getElementById("slots").innerText=
 a+" "+b+" "+c;
 if(a===b && b===c) {
  coins+=100;
  document.getElementById("result").innerText="YOU WIN 100 COINS!";
 } else {
  document.getElementById("result").innerText="TRY AGAIN!";
 }
 update();
}

function roulette() {
 if(coins<10) {
  alert("Not enough coins!");
  return;
 }
 coins-=10;
 let n=Math.floor(Math.random()*37);
 document.getElementById("wheel").innerText="🎡 "+n;
 if(n===0) {
  coins+=200;
  document.getElementById("result").innerText="YOU WIN 200 COINS!";
 } else {
  document.getElementById("result").innerText="TRY AGAIN!";
 }
 update();
}
</script>
</body>
</html>
