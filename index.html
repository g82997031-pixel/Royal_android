<head>HTML
<link rel="manifest" href="./manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL</title>
<style>
body{background:#100d08;color:gold;text-align:center;font-family:Arial;padding:15px}
h1{font-size:40px}
.card{background:#292016;border:2px solid gold;border-radius:18px;padding:20px;margin:18px 0}
button{background:gold;color:#160d00;border:0;border-radius:10px;padding:14px 25px;font-size:18px;font-weight:bold}

<body>
<h1>👑 ROYAL 👑</h1>
<h3>WELCOME TO ROYAL GAMES</h3>

<div class="card">
<h2>🪙 Virtual Coins</h2>
<h2 id="coins">1000</h2>
</div>

<div class="card">
<h2>🎰 SLOT GAME</h2>
<h1 id="slots">🍒 🍋 🍇</h1>
<button onclick="spin()">SPIN</button>
</div>

<div class="card">
<h2>🎡 ROULETTE</h2>
<h1 id="wheel">🎡</h1>
<button onclick="roulette()">PLAY</button>
</div>
<p id="result">Good Luck!</p>

<script>
let coins=1000;
function update(){
document.getElementById("coins").innerText=coins;
}
function spin(){
if(coins<10)return;
coins-=10;
let a=["🍒","🍋","🍇","💎","7️⃣"];
let x=a[Math.floor(Math.random()*5)];
let y=a[Math.floor(Math.random()*5)];
let z=a[Math.floor(Math.random()*5)];
document.getElementById("slots").innerText=x+" "+y+" "+z;
if(x===y&&y===z){
coins+=100;
document.getElementById("result").innerText="YOU WIN 100 COINS!";
}else{
document.getElementById("result").innerText="TRY AGAIN!";
}
update();
}
function roulette(){
if(coins<10)return;
coins-=10;
let n=Math.floor(Math.random()*37);
document.getElementById("wheel").innerText="🎡 "+n;
if(n===0){
coins+=200;
document.getElementById("result").innerText="YOU WIN 200 COINS!";
}else{
document.getElementById("result").innerText="TRY AGAIN!";
}
update();
}
</script>
</HTML
